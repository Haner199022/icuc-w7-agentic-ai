let idx = 0, fontSize = 16, deckPopup = null, syncChannel = null;
try {
  syncChannel = new BroadcastChannel("icuc_series_w7");
  syncChannel.onmessage = (ev) => {
    if (ev.data && ev.data.type === 'slideChanged' && typeof ev.data.index === 'number') selectSlide(ev.data.index, false);
  };
} catch (e) {}
const railList = document.getElementById('railList'), slideFrame = document.getElementById('slideFrame');
let lastSec = '';
SCRIPTS.forEach((s, i) => {
  if (s.sec !== lastSec) {
    lastSec = s.sec;
    const hd = document.createElement('div'); hd.className = 'rail-sec-hd'; hd.textContent = s.sec; railList.appendChild(hd);
  }
  const btn = document.createElement('button'); btn.className = 'rail-btn'; btn.dataset.index = i;
  btn.innerHTML = `<span class="rail-num">P${String(i+1).padStart(2,'0')}</span><span>${s.title}</span>`;
  btn.onclick = () => selectSlide(i, true);
  railList.appendChild(btn);
});
function selectSlide(newIdx, pushSync) {
  idx = Math.max(0, Math.min(SCRIPTS.length - 1, newIdx));
  const s = SCRIPTS[idx], num = String(idx + 1).padStart(2, '0');
  document.getElementById('spNum').textContent = `第 ${num} / ${SCRIPTS.length} 页 · ${s.sec}`;
  document.getElementById('spTime').textContent = s.time;
  document.getElementById('spTitle').textContent = s.title;
  document.getElementById('spCue').innerHTML = `<strong>[切页 / 动作] </strong>${s.cue}`;
  const inter = document.getElementById('spInteract');
  if (s.interact) { inter.style.display = 'block'; inter.innerHTML = `<strong>[互动提问] </strong>${s.interact}`; }
  else inter.style.display = 'none';
  document.getElementById('spBody').textContent = s.body;
  railList.querySelectorAll('.rail-btn').forEach(b => {
    const act = Number(b.dataset.index) === idx; b.classList.toggle('active', act);
    if (act) b.scrollIntoView({ block: 'nearest' });
  });
  if (pushSync) {
    try { slideFrame.contentWindow.postMessage({ type: 'seriesGoto', index: idx }, '*'); } catch (e) {}
    try { if (syncChannel) syncChannel.postMessage({ type: 'goto', index: idx }); } catch (e) {}
    try { if (deckPopup && !deckPopup.closed) deckPopup.postMessage({ type: 'seriesGoto', index: idx }, '*'); } catch (e) {}
    document.getElementById('syncStatus').textContent = `已同步至第 ${num} 页`;
  }
}
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'seriesSlideChanged' && typeof e.data.index === 'number') selectSlide(e.data.index, false);
});
document.getElementById('btnPrevSlide').onclick = () => selectSlide(idx - 1, true);
document.getElementById('btnNextSlide').onclick = () => selectSlide(idx + 1, true);
document.getElementById('btnPopDeck').onclick = () => {
  deckPopup = window.open(`W7-第1次课-大屏交互课件.html#p${String(idx+1).padStart(2,'0')}`, "icuc_series_w7_win", 'width=1360,height=820');
  document.getElementById('syncStatus').textContent = '双屏已联动';
};
window.changeFont = (d) => { fontSize = Math.max(13, Math.min(24, fontSize + d)); document.documentElement.style.setProperty('--script-size', fontSize + 'px'); };
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); selectSlide(idx + 1, true); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); selectSlide(idx - 1, true); }
});
let qLeft = 840, qHandle = null;
const fmt = (sec) => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
window.startQuickTimer = (sec) => {
  if (qHandle) clearInterval(qHandle); qLeft = sec;
  document.getElementById('pTimerDisp').textContent = fmt(qLeft);
  document.getElementById('btnTimerToggle').textContent = '暂停';
  qHandle = setInterval(() => {
    if (qLeft > 0) { qLeft--; document.getElementById('pTimerDisp').textContent = fmt(qLeft); }
    else { clearInterval(qHandle); qHandle = null; document.getElementById('pTimerDisp').textContent = '00:00 时间到'; }
  }, 1000);
};
window.toggleQuickTimer = () => {
  const btn = document.getElementById('btnTimerToggle');
  if (qHandle) { clearInterval(qHandle); qHandle = null; btn.textContent = '继续'; }
  else if (qLeft > 0) startQuickTimer(qLeft);
};
function fitPreview() {
  const wrap = document.getElementById('previewWrap'), box = document.getElementById('previewBox'), frame = document.getElementById('slideFrame');
  if (!wrap || !box || !frame) return;
  const scale = Math.min(Math.max(200, wrap.clientWidth - 32) / 1360, Math.max(160, wrap.clientHeight - 32) / 820);
  box.style.width = Math.floor(1360 * scale) + 'px'; box.style.height = Math.floor(820 * scale) + 'px';
  frame.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitPreview); fitPreview(); selectSlide(0, false);
